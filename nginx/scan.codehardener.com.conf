# scan.codehardener.com - Code Hardener Dashboard + API
# Admin-IP-only access (reuses $is_admin geo map from 00-security-maps.conf)

server {
    listen 443 ssl;
    server_name scan.codehardener.com;
    include /etc/nginx/snippets/security-checks.conf;

    ssl_certificate /etc/letsencrypt/live/scan.codehardener.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scan.codehardener.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Hide server identity
    server_tokens off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Block dotfiles (except .well-known)
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Block source maps
    location ~* \.map$ {
        return 404;
    }

    # --- Health check (open — no IP restriction, for monitoring) ---
    location = /health {
        proxy_pass http://127.0.0.1:7002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin-only gate: everything below requires $is_admin ---
    # Non-admin gets silent drop (444)
    set $deny_access 0;
    if ($is_admin = 0) {
        set $deny_access 1;
    }

    # --- API routes → backend:7002 ---
    location /api/ {
        if ($deny_access) { return 444; }
        proxy_pass http://127.0.0.1:7002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        # Large scan payloads
        client_max_body_size 50M;
    }

    # --- Internal API routes → backend:7002 ---
    location /internal/ {
        if ($deny_access) { return 444; }
        proxy_pass http://127.0.0.1:7002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- MCP SSE endpoint → backend:7002 (needs SSE/WebSocket headers) ---
    location /mcp/ {
        if ($deny_access) { return 444; }
        proxy_pass http://127.0.0.1:7002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # WebSocket upgrade (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Dashboard (Next.js) → dashboard:7001 ---
    location / {
        if ($deny_access) { return 444; }
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR / WebSocket (dev only, but doesn't hurt in prod)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTP → HTTPS redirect + Let's Encrypt challenge
server {
    listen 80;
    server_name scan.codehardener.com;
    include /etc/nginx/snippets/security-checks.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
