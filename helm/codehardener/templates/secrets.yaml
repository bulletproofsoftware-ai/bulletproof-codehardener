{{/*
Application-owned secrets only.

`database-url`, `redis-url` and `redis-password` used to live here, built by
interpolating .Values.postgresql.auth.password / .Values.redis.auth.password
into a connection string. Those values are empty by default — the Bitnami
subcharts generate their own passwords into their own Secrets, which this chart
never read — so the rendered URLs came out as
`postgresql://codehardener:@ch-postgresql:5432/codehardener` and the backend
could not authenticate to either datastore.

Connection URLs are now assembled per-container from the subchart's own Secret;
see `codehardener.datastoreEnv` in _helpers.tpl.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: codehardener-secrets
  labels:
    {{- include "codehardener.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ randAlphaNum 64 | quote }}
