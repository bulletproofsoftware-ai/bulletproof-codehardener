apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codehardener.scanner.fullname" . }}
  labels:
    {{- include "codehardener.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
spec:
  {{- if not .Values.scanner.keda.enabled }}
  replicas: {{ .Values.scanner.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: scanner
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scanner
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scanner
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if .Values.scanner.runtimeClassName }}
      runtimeClassName: {{ .Values.scanner.runtimeClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.scanner.securityContext | nindent 8 }}
      containers:
        - name: scanner
          image: "{{ .Values.global.imageRegistry }}{{ .Values.scanner.image.repository }}:{{ .Values.scanner.image.tag }}"
          imagePullPolicy: {{ .Values.scanner.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.scanner.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- include "codehardener.datastoreEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.scanner.resources | nindent 12 }}
          volumeMounts:
            - name: scan-workspace
              mountPath: /tmp/scans
            - name: scanner-tools
              mountPath: /opt/scanners
              readOnly: true
      volumes:
        - name: scan-workspace
          emptyDir:
            sizeLimit: 2Gi
        - name: scanner-tools
          emptyDir: {}
