# Code Hardener Helm Chart Values
# Override these values in your environment-specific values file.

global:
  imageRegistry: ""
  imagePullSecrets: []

# ============================================================================
# Backend API
# ============================================================================
backend:
  replicaCount: 2
  image:
    repository: codehardener/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    NODE_ENV: production
    LOG_LEVEL: info
    RATE_LIMIT_MAX_REQUESTS: "100"
  envFrom:
    - secretRef:
        name: codehardener-secrets
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# ============================================================================
# Scanner Workers
# ============================================================================
scanner:
  replicaCount: 1
  image:
    repository: codehardener/scanner
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  env:
    SCANNER_TIMEOUT_MS: "300000"
    SCANNER_MAX_CONCURRENT: "3"
  # KEDA autoscaling based on BullMQ queue depth
  keda:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 20
    pollingInterval: 15
    cooldownPeriod: 300
    triggers:
      - type: redis
        metadata:
          listName: "bull:scan-queue:wait"
          listLength: "5"
  # gVisor runtime class for sandbox isolation
  runtimeClassName: gvisor
  # Security context for scan containers
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ============================================================================
# Dashboard (Next.js)
# ============================================================================
dashboard:
  replicaCount: 2
  image:
    repository: codehardener/dashboard
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# ============================================================================
# n8n Workflow Engine
# ============================================================================
n8n:
  enabled: true
  replicaCount: 1
  image:
    repository: n8nio/n8n
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5678
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

# ============================================================================
# PostgreSQL (via Bitnami subchart)
# ============================================================================
postgresql:
  enabled: true
  auth:
    # No password defaults are shipped here on purpose. `postgresPassword: ""`
    # and `password: ""` read as "a default exists", and they do not — an empty
    # value is not a working credential, it is a broken deploy waiting to be
    # discovered in CrashLoopBackOff (CodeQL js/empty-password-in-configuration-file).
    #
    # Left unset, the subchart generates a random password into the
    # `<release>-postgresql` Secret and this chart's workloads read it from
    # there (see codehardener.datastoreEnv in templates/_helpers.tpl). A default
    # `helm install` is therefore self-sufficient.
    #
    # To pin the credential instead, either:
    #   --set postgresql.auth.postgresPassword=... --set postgresql.auth.password=...
    # or point at a pre-existing Secret:
    #   --set postgresql.auth.existingSecret=my-pg-secret
    #   --set postgresql.auth.secretKeys.userPasswordKey=password
    # Both are honoured — the templates resolve the Secret name and key through
    # the subchart's own helpers rather than re-interpolating the password.
    username: codehardener
    database: codehardener
  primary:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    persistence:
      enabled: true
      size: 20Gi
  metrics:
    enabled: true

# ============================================================================
# Redis (via Bitnami subchart)
# ============================================================================
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    # As above: no empty-string default. Left unset, the subchart generates a
    # random password into the `<release>-redis` Secret, and REDIS_URL /
    # the KEDA TriggerAuthentication read it from there.
    #
    # To pin it:            --set redis.auth.password=...
    # To reuse a Secret:    --set redis.auth.existingSecret=my-redis-secret
    #                       --set redis.auth.existingSecretPasswordKey=redis-password
  master:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    persistence:
      enabled: true
      size: 5Gi

# ============================================================================
# External datastores (used only when the matching subchart is disabled)
# ============================================================================
# With postgresql.enabled=false / redis.enabled=false there is no subchart
# Secret to read, so the host and a pre-existing Secret must be supplied here.
# Rendering fails with an explicit message if they are missing, rather than
# emitting a connection URL with no credential in it.
externalDatabase:
  host: ""
  port: 5432
  username: codehardener
  database: codehardener
  # Name of an existing Secret in the release namespace holding the password.
  existingSecret: ""
  existingSecretPasswordKey: password

externalRedis:
  host: ""
  port: 6379
  # Leave existingSecret empty only if the external Redis has no password;
  # REDIS_URL is then rendered without credentials.
  existingSecret: ""
  existingSecretPasswordKey: redis-password

# ============================================================================
# Ingress
# ============================================================================
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: api.codehardener.com
      paths:
        - path: /
          pathType: Prefix
          service: backend
    - host: app.codehardener.com
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
  tls:
    - secretName: codehardener-tls
      hosts:
        - api.codehardener.com
        - app.codehardener.com

# ============================================================================
# Network Policies
# ============================================================================
networkPolicy:
  enabled: true

# ============================================================================
# Service Account
# ============================================================================
serviceAccount:
  create: true
  name: codehardener
  annotations: {}
