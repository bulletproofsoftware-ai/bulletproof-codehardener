# gitleaks config for bulletproof-codehardener.
# Allowlists verified false positives: API keys are read from env vars (no hardcoded
# values), and curl auth examples appear in docs, marketing pages, the Makefile, and
# test/e2e scripts. No real secrets present.

[extend]
useDefault = true

[allowlist]
description = "Env-var key reads and curl examples in docs/scripts (no real secrets)"
paths = [
  '''Makefile''',
  '''.*\.md$''',
  '''.*\.html$''',
  '''scripts/.*\.sh$''',
  '''.*\.test\.ts$''',
]
regexes = [
  '''env\.N8N_API_KEY''',
  '''X-N8N-API-KEY''',
  '''curl .*(localhost|example\.com|-u |Authorization)''',
]
