# Code Hardener - Production Deployment (external Postgres + n8n)
#
# Use this overlay when Postgres and n8n are already running elsewhere in your
# environment (a managed database, another compose project, or a separate host)
# and you only want Code Hardener's own services here.
#
# Required in .env (no defaults are provided — set them explicitly):
#   EXTERNAL_POSTGRES_HOST   hostname/IP of your PostgreSQL 16 instance
#   EXTERNAL_N8N_HOST        hostname/IP of your n8n instance
#   PUBLIC_BASE_URL          public origin the dashboard is served from
#   DB_PASSWORD, JWT_SECRET, N8N_API_KEY, INTERNAL_API_KEY
#
# If the external services live on another Docker network, attach it yourself:
#   docker network connect <your-network> codehardener-backend-1
#
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # ============================================================
  # Redis - Own instance (avoids key collisions with claude-memory)
  # ============================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codehardener

  # ============================================================
  # Backend API + MCP SSE endpoint
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DB_HOST: ${EXTERNAL_POSTGRES_HOST:?Set EXTERNAL_POSTGRES_HOST in .env}
      DB_PORT: ${EXTERNAL_POSTGRES_PORT:-5432}
      DB_NAME: codehardener
      DB_USER: codehardener
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      LOG_LEVEL: info
      N8N_URL: http://${EXTERNAL_N8N_HOST:?Set EXTERNAL_N8N_HOST in .env}:${EXTERNAL_N8N_PORT:-5678}
      N8N_ENABLED: "true"
      N8N_WEBHOOK_BASE: http://${EXTERNAL_N8N_HOST:?Set EXTERNAL_N8N_HOST in .env}:${EXTERNAL_N8N_PORT:-5678}/webhook
      N8N_API_KEY: ${N8N_API_KEY:?Set N8N_API_KEY in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      SIGNING_KEYS_DIR: /data/keys
      SCANNER_MAX_CONCURRENT: ${SCANNER_MAX_CONCURRENT:-3}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      - signing_keys:/data/keys
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - codehardener

  # ============================================================
  # Scanner Worker - 49 security tools
  # ============================================================
  scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile.scanner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: ${EXTERNAL_POSTGRES_HOST:?Set EXTERNAL_POSTGRES_HOST in .env}
      DB_PORT: ${EXTERNAL_POSTGRES_PORT:-5432}
      DB_NAME: codehardener
      DB_USER: codehardener
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: info
      SCANNER_TIMEOUT_MS: 300000
      SCANNER_MAX_CONCURRENT: ${SCANNER_MAX_CONCURRENT:-3}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
    volumes:
      - scan_targets:/scan-target
      - scan_results:/scan-results
      - ./scanner-configs:/configs:ro
      - ./nuclei-templates:/nuclei-templates:ro
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    networks:
      - codehardener

  # ============================================================
  # Dashboard - Next.js frontend
  # ============================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}/api/v1
        NEXT_PUBLIC_DEV_MODE: "false"
        API_URL: http://backend:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://backend:4000
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3001}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - codehardener

  # ============================================================
  # Init - One-shot schema + migration runner
  # ============================================================
  init:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/app/scripts/init-all.sh"]
    environment:
      DB_HOST: ${EXTERNAL_POSTGRES_HOST:?Set EXTERNAL_POSTGRES_HOST in .env}
      DB_PORT: ${EXTERNAL_POSTGRES_PORT:-5432}
      DB_USER: codehardener
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: codehardener
    volumes:
      - ./postgres/migrations:/app/migrations:ro
      - ./scripts:/app/scripts:ro
    restart: "no"
    networks:
      - codehardener

networks:
  codehardener:
    driver: bridge

volumes:
  redis_data:
  scan_targets:
  scan_results:
  signing_keys:
