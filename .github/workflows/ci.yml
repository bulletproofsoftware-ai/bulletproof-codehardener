name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend Type Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codehardener
          POSTGRES_USER: codehardener
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codehardener"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: codehardener
          DB_USER: codehardener
          DB_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_SECRET: ci-test-secret
          INTERNAL_API_KEY: ci-test-key
          N8N_API_KEY: ci-test-n8n
          NODE_ENV: test

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:7002/api/v1
          NEXT_PUBLIC_DEV_MODE: "true"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t codehardener-backend ./backend
      - name: Build dashboard
        run: docker build -t codehardener-dashboard ./dashboard --build-arg NEXT_PUBLIC_API_URL=http://localhost:7002/api/v1
      - name: Build scanner
        run: docker build -t codehardener-scanner -f backend/Dockerfile.scanner ./backend
