name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-check:
    name: Backend Type Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codehardener
          POSTGRES_USER: codehardener
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codehardener"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: codehardener
          DB_USER: codehardener
          DB_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_SECRET: ci-test-secret
          INTERNAL_API_KEY: ci-test-key
          N8N_API_KEY: ci-test-n8n
          NODE_ENV: test

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_DEV_MODE: "true"

  # The three images are built on separate runners rather than serially on one.
  # The scanner image bundles ~58 security tools (JDK, .NET SDK, Go toolchain,
  # ZAP, Playwright, Allure, PMD, ...) and is tens of gigabytes. Building it
  # after the backend and dashboard images on a single stock ubuntu-latest
  # runner exhausted the root filesystem: every build stage — including the
  # "All External Tools Verified" stage — completed, then the job died during
  # "exporting layers" with exit 143 and "The runner has received a shutdown
  # signal", which is what a disk-full runner service looks like. Splitting the
  # matrix gives the scanner a whole runner, and the cleanup step below
  # reclaims the pre-installed toolchains this job never uses.
  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, dashboard, scanner]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reclaim runner disk space
        run: |
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache \
            /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
          sudo docker builder prune --all --force || true
          echo "=== disk after cleanup ==="
          df -h /

      - name: Build backend
        if: matrix.image == 'backend'
        run: docker build -t codehardener-backend ./backend

      - name: Build dashboard
        if: matrix.image == 'dashboard'
        run: docker build -t codehardener-dashboard ./dashboard --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1

      - name: Build scanner
        if: matrix.image == 'scanner'
        run: docker build -t codehardener-scanner -f backend/Dockerfile.scanner ./backend

      # Diagnostics: if a build ever runs the runner out of space again, the
      # headroom that was actually left is in the log rather than guessed at.
      - name: Report disk usage and image size
        if: always()
        run: |
          df -h /
          docker system df || true
          docker images || true
