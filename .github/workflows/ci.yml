name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-check:
    name: Backend Type Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codehardener
          POSTGRES_USER: codehardener
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codehardener"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: codehardener
          DB_USER: codehardener
          DB_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_SECRET: ci-test-secret
          INTERNAL_API_KEY: ci-test-key
          N8N_API_KEY: ci-test-n8n
          NODE_ENV: test

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_DEV_MODE: "true"

  # The three images build on separate runners rather than serially on one, so
  # a failure names the image that failed and the slow scanner build does not
  # gate the other two.
  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, dashboard, scanner]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Report runner disk space
        run: df -h /

      - name: Build backend
        if: matrix.image == 'backend'
        run: docker build -t codehardener-backend ./backend

      - name: Build dashboard
        if: matrix.image == 'dashboard'
        run: docker build -t codehardener-dashboard ./dashboard --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1

      # The scanner image bundles ~58 tools (JDK, .NET SDK, Go toolchain, ZAP,
      # Playwright, Allure, PMD, ...) and is tens of gigabytes.
      #
      # Every instruction in the Dockerfile succeeds, including the explicit
      # "=== All External Tools Verified ===" stage and stage-1 70/70. The job
      # then died inside BuildKit's single monolithic "exporting layers" phase:
      # exit 143, with even the `if: always()` reporting step and the Post
      # actions/checkout step skipped — which only happens when the runner
      # process itself is destroyed rather than a step merely failing.
      #
      # It is NOT disk exhaustion. Instrumenting the runner showed 88 GB free
      # before any cleanup and 119 GB free after, and the export died six
      # minutes in without ever approaching that. Serialising an image this
      # large is simply more than a stock hosted runner survives.
      #
      # `--output type=cacheonly` executes every instruction — the tool
      # installs and the verification stage included — and drops only the
      # final packaging of an image that nothing else in this workflow
      # consumes. The Dockerfile is still fully exercised; what is skipped is
      # the redundant export, not the verification.
      - name: Build scanner
        if: matrix.image == 'scanner'
        run: |
          docker buildx build \
            --output type=cacheonly \
            --progress plain \
            -f backend/Dockerfile.scanner \
            ./backend

      - name: Report disk usage and image size
        if: always()
        run: |
          df -h /
          free -h || true
          docker system df || true
