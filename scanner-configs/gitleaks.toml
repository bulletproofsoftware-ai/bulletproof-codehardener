[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''(?i)\b(ghp_[a-zA-Z0-9]{36})\b'''
keywords = ["ghp_"]
tags = ["vcs", "github", "pat"]

[[rules]]
id = "github-oauth"
description = "GitHub OAuth Access Token"
regex = '''(?i)\b(gho_[a-zA-Z0-9]{36})\b'''
keywords = ["gho_"]
tags = ["vcs", "github", "oauth"]

[[rules]]
id = "github-fine-grained-pat"
description = "GitHub Fine-Grained Personal Access Token"
regex = '''(?i)\b(github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59})\b'''
keywords = ["github_pat_"]
tags = ["vcs", "github", "fine-grained-pat"]

[[rules]]
id = "gitlab-pat"
description = "GitLab Personal Access Token"
regex = '''(?i)\b(glpat-[a-zA-Z0-9_-]{20})\b'''
keywords = ["glpat-"]
tags = ["vcs", "gitlab", "pat"]

[[rules]]
id = "npm-token"
description = "NPM Access Token"
regex = '''(?i)\b(npm_[a-zA-Z0-9]{36})\b'''
keywords = ["npm_"]
tags = ["cicd", "npm", "token"]

# ─────────────────────────────────────────────
# Allowlist — Common False Positives
# ─────────────────────────────────────────────

[allowlist]
description = "Global allowlist for known false positives"
paths = [
    '''(^|/)test(s)?/''',
    '''(^|/)__test(s)?__/''',
    '''(^|/)spec(s)?/''',
    '''(^|/)fixture(s)?/''',
    '''(^|/)mock(s)?/''',
    '''\.test\.(ts|js|py|go|rb)$''',
    '''\.spec\.(ts|js|py|go|rb)$''',
    '''(^|/)examples?/''',
    '''(^|/)docs?/''',
    '''(^|/)documentation/''',
    '''README\.md$''',
    '''CHANGELOG\.md$''',
    '''\.example$''',
    '''\.sample$''',
    '''\.template$''',
    '''node_modules/''',
    '''vendor/''',
    '''\.git/''',
    '''\.env\.example$''',
    '''\.env\.sample$''',
    '''\.env\.template$''',
    '''gitleaks\.toml$''',
    '''\.gitleaks\.toml$''',
]
regexes = [
    '''(?i)EXAMPLE|PLACEHOLDER|CHANGEME|REPLACE_ME|YOUR_.*_HERE|INSERT_.*_HERE|TODO|FIXME|XXX''',
    '''(?i)sk-[x]{20,}''',
    '''(?i)(test|fake|mock|dummy|sample|example)[_-]?(key|token|secret|password)''',
    '''(?i)password\s*[:=]\s*["\']?(password|changeme|secret|admin|test|example)["\']?''',
    '''0{20,}''',
    '''x{20,}''',
    '''_{20,}''',
    '''\.{20,}''',
]
