# Code Hardener - Custom Semgrep Rules for AI-Generated Code Patterns
# These rules target common security anti-patterns introduced by AI coding assistants.
# Reference: https://semgrep.dev/docs/writing-rules/rule-syntax

rules:

  # ───────────────────────────────────────────
  # Hardcoded Localhost / Development URLs
  # ───────────────────────────────────────────

  - id: hardcoded-localhost-url
    patterns:
      - pattern-either:
          - pattern: |
              "http://localhost:..."
          - pattern: |
              "http://127.0.0.1:..."
          - pattern: |
              "http://0.0.0.0:..."
          - pattern: |
              `http://localhost:${...}`
          - pattern: |
              `http://127.0.0.1:${...}`
      - pattern-not-inside: |
          // ...test...
      - pattern-not-inside: |
          /* ...test... */
      - pattern-not-inside: |
          if (process.env.NODE_ENV === "test") { ... }
      - pattern-not-inside: |
          if (process.env.NODE_ENV === "development") { ... }
    message: >
      Hardcoded localhost URL found. AI code generators frequently embed development
      URLs directly in source. Use environment variables or configuration objects.
      Example: process.env.API_URL || config.apiUrl
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe:
        - "CWE-547: Use of Hard-coded, Security-relevant Constants"
      category: security
      technology:
        - javascript
        - typescript
      confidence: MEDIUM
      ai-pattern: true

  - id: hardcoded-localhost-url-python
    patterns:
      - pattern-either:
          - pattern: |
              "http://localhost:..."
          - pattern: |
              "http://127.0.0.1:..."
          - pattern: |
              f"http://localhost:{...}"
          - pattern: |
              f"http://127.0.0.1:{...}"
      - pattern-not-inside: |
          # ...test...
    message: >
      Hardcoded localhost URL in Python code. Use environment variables via
      os.environ.get() or a configuration module.
    languages: [python]
    severity: WARNING
    metadata:
      cwe:
        - "CWE-547: Use of Hard-coded, Security-relevant Constants"
      category: security
      confidence: MEDIUM
      ai-pattern: true

  # ───────────────────────────────────────────
  # Missing Input Validation
  # ───────────────────────────────────────────

  - id: express-missing-input-validation
    patterns:
      - pattern: |
          $APP.$METHOD($PATH, (req, res) => {
            ...
            $REQ_BODY = req.body;
            ...
          })
      - pattern-not-inside: |
          $APP.$METHOD($PATH, $VALIDATOR, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: (post|put|patch|delete)
    message: >
      Request handler accesses req.body without apparent input validation middleware.
      AI generators often skip validation. Use express-validator, joi, zod, or similar.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe:
        - "CWE-20: Improper Input Validation"
      category: security
      confidence: LOW
      ai-pattern: true

  - id: express-unvalidated-params
    patterns:
      - pattern-either:
          - pattern: |
              req.params.$PARAM
          - pattern: |
              req.query.$PARAM
      - pattern-not-inside: |
          if (...) { ... }
      - pattern-not-inside: |
          $SCHEMA.validate(...)
      - pattern-not-inside: |
          $SCHEMA.parse(...)
    message: >
      Request parameter or query string used without validation. Validate and
      sanitize all user input before use.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe:
        - "CWE-20: Improper Input Validation"
      category: security
      confidence: LOW
      ai-pattern: true

  # ───────────────────────────────────────────
  # SQL Injection via String Concatenation
  # ───────────────────────────────────────────

  - id: sql-string-concatenation-js
    patterns:
      - pattern-either:
          - pattern: |
              $QUERY = "SELECT " + ...
          - pattern: |
              $QUERY = "INSERT " + ...
          - pattern: |
              $QUERY = "UPDATE " + ...
          - pattern: |
              $QUERY = "DELETE " + ...
          - pattern: |
              $QUERY = `SELECT ...${...}...`
          - pattern: |
              $QUERY = `INSERT ...${...}...`
          - pattern: |
              $QUERY = `UPDATE ...${...}...`
          - pattern: |
              $QUERY = `DELETE ...${...}...`
    message: >
      SQL query built via string concatenation or template literal interpolation.
      This is a critical SQL injection vector. Use parameterized queries:
      db.query('SELECT * FROM users WHERE id = $1', [userId])
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      ai-pattern: true

  - id: sql-string-concatenation-python
    patterns:
      - pattern-either:
          - pattern: |
              $CURSOR.execute("..." + $VAR + "...")
          - pattern: |
              $CURSOR.execute(f"...{$VAR}...")
          - pattern: |
              $CURSOR.execute("...%s..." % $VAR)
          - pattern: |
              $CURSOR.execute("...{}...".format($VAR))
    message: >
      SQL query built via string formatting in Python. Use parameterized queries:
      cursor.execute('SELECT * FROM users WHERE id = %s', (user_id,))
    languages: [python]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      ai-pattern: true

  # ───────────────────────────────────────────
  # Dynamic Code Execution with Untrusted Input
  # ───────────────────────────────────────────

  - id: dynamic-code-execution-js
    patterns:
      - pattern-either:
          - pattern: $EVAL_FN($VAR)
          - pattern: $EVAL_FN(... + ...)
          - pattern: $EVAL_FN(`...${...}...`)
      - metavariable-regex:
          metavariable: $EVAL_FN
          regex: ^(eval|Function)$
      - pattern-not: $EVAL_FN("...")
    message: >
      Dynamic code execution function called with non-literal input.
      This enables arbitrary code execution. Refactor to avoid dynamic code
      evaluation entirely. If absolutely necessary, use a sandboxed environment.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      ai-pattern: true

  - id: dynamic-code-execution-python
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $FN($VAR)
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(exec|compile)$
              - pattern-not: $FN("...")
          - patterns:
              - pattern: $FN($VAR)
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(eval)$
              - pattern-not: $FN("...")
    message: >
      Dynamic code execution called with non-literal input. This enables
      arbitrary code execution. Use ast.literal_eval() for safe evaluation of
      literals, or refactor to avoid dynamic evaluation entirely.
    languages: [python]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      ai-pattern: true

  # ───────────────────────────────────────────
  # Insecure Randomness
  # ───────────────────────────────────────────

  - id: insecure-random-js
    patterns:
      - pattern: Math.random()
      - pattern-inside: |
          function $FUNC(...) {
            ...
          }
      - metavariable-regex:
          metavariable: $FUNC
          regex: (?i).*(token|secret|key|password|hash|salt|nonce|csrf|session|auth|otp|code|verify).*
    message: >
      Math.random() used in a security-sensitive function. Math.random() is not
      cryptographically secure. Use crypto.randomBytes(), crypto.randomUUID(),
      or crypto.getRandomValues() instead.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-330: Use of Insufficiently Random Values"
      category: security
      confidence: HIGH
      ai-pattern: true

  - id: insecure-random-js-general
    pattern: Math.random()
    message: >
      Math.random() is not cryptographically secure. If this value is used for
      any security purpose (tokens, IDs, keys, etc.), use crypto.randomBytes()
      or crypto.randomUUID() instead.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe:
        - "CWE-330: Use of Insufficiently Random Values"
      category: security
      confidence: LOW
      ai-pattern: true

  - id: insecure-random-python
    patterns:
      - pattern-either:
          - pattern: random.random()
          - pattern: random.randint(...)
          - pattern: random.choice(...)
          - pattern: random.randrange(...)
      - pattern-inside: |
          def $FUNC(...):
            ...
      - metavariable-regex:
          metavariable: $FUNC
          regex: (?i).*(token|secret|key|password|hash|salt|nonce|csrf|session|auth|otp|code|verify).*
    message: >
      Python random module used in a security-sensitive function. The random module
      is not cryptographically secure. Use secrets.token_hex(), secrets.token_urlsafe(),
      or os.urandom() instead.
    languages: [python]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-330: Use of Insufficiently Random Values"
      category: security
      confidence: HIGH
      ai-pattern: true

  # ───────────────────────────────────────────
  # Missing CSRF Protection
  # ───────────────────────────────────────────

  - id: express-missing-csrf
    patterns:
      - pattern: |
          $APP.post($PATH, (req, res) => {
            ...
          })
      - pattern-not-inside: |
          $APP.use($CSRF)
      - pattern-not-inside: |
          $APP.post($PATH, $CSRF_MIDDLEWARE, ...)
    message: >
      POST endpoint without CSRF protection middleware. AI generators frequently
      omit CSRF tokens. Use csurf, csrf-csrf, or implement double-submit cookie pattern.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe:
        - "CWE-352: Cross-Site Request Forgery (CSRF)"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      confidence: LOW
      ai-pattern: true

  # ───────────────────────────────────────────
  # Unvalidated Redirects
  # ───────────────────────────────────────────

  - id: unvalidated-redirect-js
    patterns:
      - pattern-either:
          - pattern: res.redirect(req.query.$PARAM)
          - pattern: res.redirect(req.body.$PARAM)
          - pattern: res.redirect(req.params.$PARAM)
          - pattern: |
              $URL = req.query.$PARAM;
              ...
              res.redirect($URL);
          - pattern: |
              $URL = req.body.$PARAM;
              ...
              res.redirect($URL);
    message: >
      Redirect using unvalidated user input. This enables open redirect attacks
      for phishing. Validate the redirect URL against an allowlist of permitted
      domains or use relative paths only.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-601: URL Redirection to Untrusted Site"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      confidence: HIGH
      ai-pattern: true

  - id: unvalidated-redirect-python
    patterns:
      - pattern-either:
          - pattern: redirect(request.args.get(...))
          - pattern: redirect(request.form.get(...))
          - pattern: |
              $URL = request.args.get(...)
              ...
              redirect($URL)
          - pattern: |
              return HttpResponseRedirect(request.GET.get(...))
          - pattern: |
              return HttpResponseRedirect(request.POST.get(...))
    message: >
      Redirect using unvalidated user input in Python web framework. Validate
      redirect targets against an allowlist of permitted URLs.
    languages: [python]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-601: URL Redirection to Untrusted Site"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      confidence: HIGH
      ai-pattern: true

  # ───────────────────────────────────────────
  # Weak Cryptography
  # ───────────────────────────────────────────

  - id: weak-hash-md5-sha1-js
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5")
          - pattern: crypto.createHash("sha1")
          - pattern: crypto.createHash('md5')
          - pattern: crypto.createHash('sha1')
    message: >
      MD5/SHA1 are cryptographically broken. Use SHA-256 or SHA-3 for hashing.
      For password hashing, use bcrypt or argon2 instead.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-328: Use of Weak Hash"
      category: security
      confidence: HIGH
      ai-pattern: true

  - id: weak-hash-md5-sha1-python
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
    message: >
      MD5/SHA1 are cryptographically broken. Use hashlib.sha256() or hashlib.sha3_256().
      For password hashing, use bcrypt or argon2-cffi.
    languages: [python]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-328: Use of Weak Hash"
      category: security
      confidence: HIGH
      ai-pattern: true

  # ───────────────────────────────────────────
  # Sensitive Data Exposure
  # ───────────────────────────────────────────

  - id: error-stack-trace-exposure
    patterns:
      - pattern-either:
          - pattern: |
              res.status($CODE).json({..., stack: $ERR.stack, ...})
          - pattern: |
              res.send($ERR.stack)
          - pattern: |
              res.json({..., error: $ERR.message, ..., stack: $ERR.stack, ...})
    message: >
      Stack trace exposed in HTTP response. This leaks internal implementation
      details. Use a generic error message in production and log the stack trace
      server-side.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      category: security
      confidence: HIGH
      ai-pattern: true

  - id: console-log-sensitive
    patterns:
      - pattern-either:
          - pattern: console.log(..., $PASSWORD, ...)
          - pattern: console.log(..., $TOKEN, ...)
          - pattern: console.log(..., $SECRET, ...)
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: (?i).*(password|passwd|pwd).*
      - metavariable-regex:
          metavariable: $TOKEN
          regex: (?i).*(token|bearer|jwt|api_key|apikey).*
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(secret|private_key|credential).*
    message: >
      Sensitive data logged to console. This may appear in log aggregation
      systems. Remove or mask sensitive values before logging.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      category: security
      confidence: MEDIUM
      ai-pattern: true

  # ───────────────────────────────────────────
  # Path Traversal
  # ───────────────────────────────────────────

  - id: path-traversal-js
    patterns:
      - pattern-either:
          - pattern: fs.readFileSync(req.params.$PATH, ...)
          - pattern: fs.readFileSync(req.query.$PATH, ...)
          - pattern: fs.readFile(req.params.$PATH, ...)
          - pattern: fs.readFile(req.query.$PATH, ...)
          - pattern: |
              path.join(..., req.params.$PATH)
          - pattern: |
              path.join(..., req.query.$PATH)
          - pattern: |
              path.resolve(..., req.params.$PATH)
    message: >
      File path constructed from user input without sanitization. This enables
      path traversal attacks. Validate and sanitize the path, ensure it stays
      within the intended directory using path.resolve() and startsWith() checks.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      confidence: HIGH
      ai-pattern: true

  # ───────────────────────────────────────────
  # SSRF Prevention
  # ───────────────────────────────────────────

  - id: ssrf-user-controlled-url-js
    patterns:
      - pattern-either:
          - pattern: fetch(req.body.$URL)
          - pattern: fetch(req.query.$URL)
          - pattern: axios.get(req.body.$URL)
          - pattern: axios.get(req.query.$URL)
          - pattern: axios.post(req.body.$URL, ...)
          - pattern: |
              $URL = req.body.$PARAM;
              ...
              fetch($URL);
          - pattern: |
              $URL = req.query.$PARAM;
              ...
              fetch($URL);
    message: >
      HTTP request made to a user-controlled URL. This enables SSRF attacks
      against internal services. Validate URLs against an allowlist and block
      private IP ranges (10.x, 172.16-31.x, 192.168.x, 127.x, 169.254.x).
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery"
      category: security
      confidence: HIGH
      ai-pattern: true
